<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#431407"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="100" y="70" width="1000" height="610" rx="24" fill="#020617" stroke="#f97316" stroke-width="4"/>
  <rect x="100" y="70" width="1000" height="56" rx="24" fill="#1e293b"/>
  <circle cx="140" cy="98" r="9" fill="#f87171"/><circle cx="170" cy="98" r="9" fill="#fbbf24"/><circle cx="200" cy="98" r="9" fill="#34d399"/>
  <text x="600" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Blogs API — Express + MongoDB</text>
  <g font-family="Menlo, Consolas, monospace" font-size="26">
    <text x="150" y="185" fill="#22c55e" font-weight="700">GET</text>
    <text x="290" y="185" fill="#e2e8f0">/api/blogs</text>
    <text x="620" y="185" fill="#64748b">200 OK</text>
    <text x="150" y="225" fill="#fbbf24" font-weight="700">POST</text>
    <text x="290" y="225" fill="#e2e8f0">/api/blogs</text>
    <text x="620" y="225" fill="#64748b">201 Created</text>
    <text x="150" y="265" fill="#38bdf8" font-weight="700">PUT</text>
    <text x="290" y="265" fill="#e2e8f0">/api/blogs/:id</text>
    <text x="620" y="265" fill="#64748b">200 OK</text>
    <text x="150" y="305" fill="#f87171" font-weight="700">DELETE</text>
    <text x="290" y="305" fill="#e2e8f0">/api/blogs/:id</text>
    <text x="620" y="305" fill="#64748b">200 OK</text>
    <rect x="150" y="335" width="900" height="2" fill="#334155"/>
    <text x="150" y="390" fill="#e2e8f0">{</text>
    <text x="190" y="430"><tspan fill="#a5b4fc">"title"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"First post"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="190" y="470"><tspan fill="#a5b4fc">"author"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Johnnymax"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="190" y="510"><tspan fill="#a5b4fc">"content"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"Hello world"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="190" y="550"><tspan fill="#a5b4fc">"_id"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"66f8a1b2c3d4e5f6"</tspan><tspan fill="#e2e8f0"></tspan></text>
    <text x="150" y="590" fill="#e2e8f0">}</text>
    <rect x="150" y="620" width="16" height="30" fill="#f97316"/>
  </g>
</svg>